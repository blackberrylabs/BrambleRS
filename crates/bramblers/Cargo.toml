[package]
name = "bramblers"
description = "BrambleRS: everything your AI agents do to your machine, on one screen. Read-only, like the tools behind it."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "bramblers"
path = "src/main.rs"

[dependencies]
bramblers-core = { path = "../bramblers-core" }
bramblers-cli = { path = "../bramblers-cli" }
bramblers-cleanator-view.workspace = true
bramblers-linstruct-view.workspace = true
bramblers-mcproster-view.workspace = true
bramblers-permitt-view.workspace = true
bramblers-report.workspace = true
iced = { version = "=0.13.1", features = ["tokio"] }
bramblers-ui.workspace = true
serde.workspace = true
serde_json.workspace = true

# ---------------------------------------------------------------- packaging
# `packaging/build.sh` builds the workspace once, then runs `cargo deb --no-build` and
# `cargo generate-rpm` from here, so one package ships the app and the CLI.

[package.metadata.deb]
name = "bramblers"
maintainer = "Alexandre Do <alexandre@blackberrylabs.dev>"
copyright = "2026, Alexandre Do"
license-file = ["../../LICENSE", "0"]
extended-description = """\
BrambleRS is one read-only screen for everything AI coding agents do to a Linux machine: \
permissions, MCP servers, instruction files, disk left behind, AI spend, and what the agents \
actually ran, most serious first. The six modules run in-process; nothing is launched from \
the PATH. It changes nothing on the machine."""
section = "devel"
priority = "optional"
depends = "$auto, libxkbcommon0, libwayland-client0 | libx11-6"
recommends = "libvulkan1, mesa-vulkan-drivers"
conflicts = "blackberrylabs, blackberrylabs-full, billfold, cleanator, lastrun, linstruct, mcproster, permitt"
replaces = "blackberrylabs, blackberrylabs-full, billfold, cleanator, lastrun, linstruct, mcproster, permitt"
provides = "blackberrylabs, blackberrylabs-full, billfold, cleanator, lastrun, linstruct, mcproster, permitt"
assets = [
    ["target/release/bramblers", "usr/bin/", "755"],
    ["../../assets/bramblers.desktop", "usr/share/applications/", "644"],
    ["../../assets/icon.svg", "usr/share/icons/hicolor/scalable/apps/bramblers.svg", "644"],
    ["../../assets/icon-16.png", "usr/share/icons/hicolor/16x16/apps/bramblers.png", "644"],
    ["../../assets/icon-32.png", "usr/share/icons/hicolor/32x32/apps/bramblers.png", "644"],
    ["../../assets/icon-48.png", "usr/share/icons/hicolor/48x48/apps/bramblers.png", "644"],
    ["../../assets/icon-64.png", "usr/share/icons/hicolor/64x64/apps/bramblers.png", "644"],
    ["../../assets/icon-128.png", "usr/share/icons/hicolor/128x128/apps/bramblers.png", "644"],
    ["../../assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/bramblers.png", "644"],
    ["../../assets/icon-512.png", "usr/share/icons/hicolor/512x512/apps/bramblers.png", "644"],
    ["../../README.md", "usr/share/doc/bramblers/README.md", "644"],
]

[package.metadata.generate-rpm]
name = "bramblers"
summary = "Everything your AI agents do to your machine, on one screen"
license = "MIT"
url = "https://github.com/blackberrylabs/BrambleRS"
requires = { libxkbcommon = "*" }
assets = [
    { source = "target/release/bramblers", dest = "/usr/bin/bramblers", mode = "755" },
    { source = "assets/bramblers.desktop", dest = "/usr/share/applications/bramblers.desktop", mode = "644" },
    { source = "assets/icon.svg", dest = "/usr/share/icons/hicolor/scalable/apps/bramblers.svg", mode = "644" },
    { source = "assets/icon-16.png", dest = "/usr/share/icons/hicolor/16x16/apps/bramblers.png", mode = "644" },
    { source = "assets/icon-32.png", dest = "/usr/share/icons/hicolor/32x32/apps/bramblers.png", mode = "644" },
    { source = "assets/icon-48.png", dest = "/usr/share/icons/hicolor/48x48/apps/bramblers.png", mode = "644" },
    { source = "assets/icon-64.png", dest = "/usr/share/icons/hicolor/64x64/apps/bramblers.png", mode = "644" },
    { source = "assets/icon-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/bramblers.png", mode = "644" },
    { source = "assets/icon-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/bramblers.png", mode = "644" },
    { source = "assets/icon-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/bramblers.png", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/bramblers/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/bramblers/LICENSE", mode = "644", doc = true },
]

# The old tower and the six module packages are replaced by this one package. RPM has no
# Replaces: Obsoletes is its equivalent.
[package.metadata.generate-rpm.conflicts]
blackberrylabs = "*"
"blackberrylabs-full" = "*"
billfold = "*"
cleanator = "*"
lastrun = "*"
linstruct = "*"
mcproster = "*"
permitt = "*"

[package.metadata.generate-rpm.obsoletes]
blackberrylabs = "*"
"blackberrylabs-full" = "*"
billfold = "*"
cleanator = "*"
lastrun = "*"
linstruct = "*"
mcproster = "*"
permitt = "*"

[package.metadata.generate-rpm.provides]
blackberrylabs = "*"
"blackberrylabs-full" = "*"
billfold = "*"
cleanator = "*"
lastrun = "*"
linstruct = "*"
mcproster = "*"
permitt = "*"
