[workspace]
resolver = "2"
members = [
    "crates/bramblers-core",
    "crates/bramblers-cli",
    "crates/bramblers",
    "crates/bramblers-hostrules",
    "crates/bramblers-report",
    "crates/bramblers-ui",
    "crates/modules/billfold/core",
    "crates/modules/cleanator/core",
    "crates/modules/lastrun/core",
    "crates/modules/linstruct/core",
    "crates/modules/linstruct/view",
    "crates/modules/mcproster/core",
    "crates/modules/mcproster/view",
    "crates/modules/permitt/core",
    "crates/modules/permitt/view",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
authors = ["Alexandre Do"]
repository = "https://github.com/blackberrylabs/BrambleRS"

[workspace.dependencies]
bramblers-report = { path = "crates/bramblers-report" }
bramblers-hostrules = { path = "crates/bramblers-hostrules" }
bramblers-ui = { path = "crates/bramblers-ui" }
bramblers-billfold-core = { path = "crates/modules/billfold/core" }
bramblers-cleanator-core = { path = "crates/modules/cleanator/core" }
bramblers-lastrun-core = { path = "crates/modules/lastrun/core" }
bramblers-linstruct-core = { path = "crates/modules/linstruct/core" }
bramblers-linstruct-view = { path = "crates/modules/linstruct/view" }
bramblers-mcproster-core = { path = "crates/modules/mcproster/core" }
bramblers-mcproster-view = { path = "crates/modules/mcproster/view" }
bramblers-permitt-core = { path = "crates/modules/permitt/core" }
bramblers-permitt-view = { path = "crates/modules/permitt/view" }
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
serde_yaml_ng = "0.10"
glob = "0.3"
globset = "0.4"
regex = "1.10"
rayon = "1.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
zstd = "0.13"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"
base64 = "0.22"
ignore = "0.4"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
