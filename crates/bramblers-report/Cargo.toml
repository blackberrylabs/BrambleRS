[package]
name = "bramblers-report"
version.workspace = true
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Alexandre Do"]
repository = "https://github.com/blackberrylabs/BrambleRS"
description = "The internal report contract of BrambleRS: types, validation, severity scale, conformance check"
keywords = ["report", "schema", "desktop", "read-only"]
categories = ["data-structures"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
